<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#C599B6" />
  <meta name="description" content="Aplikasi untuk berbagi cerita dan pengalaman" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Tales" />
  
  <title>Our Tales</title>
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    .fa-sign-in-alt-left {
      transform: scaleX(-1); 
    }
  </style>
  
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // Get the current protocol and host
          const protocol = window.location.protocol;
          const host = window.location.host;
          
          // Register the service worker with the current protocol
          const registration = await navigator.serviceWorker.register('/sw.js', {
            scope: '/'
          });
          console.log('ServiceWorker registration successful with scope:', registration.scope);
          
          // Check if the app is installable
          let deferredPrompt;
          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('App is installable!');
          });
          
          // Listen for successful installation
          window.addEventListener('appinstalled', (evt) => {
            console.log('App was installed!');
          });
        } catch (err) {
          console.error('ServiceWorker registration failed:', err);
        }
      });
    } else {
      console.warn('Service Workers are not supported in this browser');
    }
  </script>
</head>
<body>

  <a href="#app" class="skip-to-content">Lewati ke konten utama</a>

  <header>
    <nav aria-label="Navigasi utama" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="#home" style="font-weight: bold; text-decoration: none; color: inherit;">Our Tales</a>
      <div>
        <a href="#home" style="margin-right: 1rem;">Our Tales</a>
        <a href="#map" style="margin-right: 1rem;">Peta</a>
        <a href="#add" style="margin-right: 1rem;">Tambah Cerita</a>
        <a href="#saved" id="saved-link" style="margin-right: 1rem; display: none;">
          Bookmark
        </a>
        <a href="#login" id="login-link" style="margin-right: 1rem;" title="Masuk">
          <i class="fas fa-sign-in-alt fa-sign-in-alt-left" aria-hidden="true"></i>
          <span class="sr-only">Masuk</span>
        </a>
        <a href="#" id="logout-btn" style="margin-right: 1rem; display: none;" title="Keluar">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          <span class="sr-only">Keluar</span>
        </a>
      </div>
    </nav>
  </header>
  
  <main id="app" tabindex="-1"></main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <footer>
    <div class="footer-container">
      <p>
        Dibuat dengan ❤️ oleh Vanya
      </p>
